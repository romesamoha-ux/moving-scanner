            let scannedItems = [];
            let scannedIds = new Set();

            function onScanSuccess(decodedText, decodedResult) {
                processScan(decodedText);
            }

            function processScan(code) {
                const parts = code.split('|');
                const itemId = parts[0];
                
                if (database[itemId]) {
                    const data = database[itemId];
                    
                    // Показываем последний
                    document.getElementById('res-room').innerText = "Помещение: " + data.room;
                    document.getElementById('res-item').innerText = data.item;
                    document.getElementById('res-owner').innerText = data.owner || "Не указан";
                    document.getElementById('last-scan').style.display = 'block';
                    
                    if (navigator.vibrate) navigator.vibrate(100);

                    // Защита от дублей
                    if (scannedIds.has(itemId)) {
                        alert("Этот предмет уже в списке: " + data.item);
                        return;
                    }

                    scannedIds.add(itemId);
                    scannedItems.push({
                        id: itemId,
                        room: data.room,
                        item: data.item,
                        owner: data.owner || "Не указан",
                        time: new Date().toLocaleTimeString()
                    });

                    updateListUI();
                } else {
                    alert("Код не найден в базе: " + code);
                }
            }

            function manualSearch() {
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                if (!query) return;
                
                // Поиск по ID или названию
                for (const [id, data] of Object.entries(database)) {
                    if (id.toLowerCase().includes(query) || 
                        data.item.toLowerCase().includes(query) || 
                        data.room.toLowerCase().includes(query)) {
                        processScan(id);
                        document.getElementById('searchInput').value = '';
                        return;
                    }
                }
                alert("Ничего не найдено по запросу: " + query);
            }

            function updateListUI() {
                const list = document.getElementById('scanned-list');
                const badge = document.getElementById('count-badge');
                
                list.innerHTML = '';
                badge.innerText = scannedItems.length;
                
                [...scannedItems].reverse().forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'scanned-item';
                    li.innerHTML = `
                        <div class="info">
                            <div class="title">${item.item}</div>
                            <div class="subtitle">${item.room} • ${item.time}</div>
                        </div>
                        <div class="owner-tag">${item.owner}</div>
                    `;
                    list.appendChild(li);
                });
            }

            function clearList() {
                if (confirm("Очистить весь список отсканированных вещей?")) {
                    scannedItems = [];
                    scannedIds.clear();
                    updateListUI();
                    document.getElementById('last-scan').style.display = 'none';
                }
            }

            function exportData() {
                if (scannedItems.length === 0) {
                    alert("Список пуст. Отсканируйте хотя бы один предмет.");
                    return;
                }

                // Экспорт CSV
                let csvContent = "\uFEFF"; // BOM для Excel
                csvContent += "ID,Помещение,Предмет,Владелец,Время\n";
                scannedItems.forEach(row => {
                    csvContent += `"${row.id}","${row.room}","${row.item}","${row.owner}","${row.time}"\n`;
                });
                downloadFile(csvContent, "Приемка_" + new Date().toISOString().slice(0,10) + ".csv", "text/csv;charset=utf-8;");

                // Экспорт TXT
                let txtContent = `ЛИСТ ПРИЕМКИ - MASTER-PEREEZDA.RU\nДата: ${new Date().toLocaleString()}\n\n`;
                scannedItems.forEach((row, idx) => {
                    txtContent += `${idx+1}. [${row.id}] ${row.room} / ${row.item} (Владелец: ${row.owner}) - ${row.time}\n`;
                });
                downloadFile(txtContent, "Приемка_" + new Date().toISOString().slice(0,10) + ".txt", "text/plain;charset=utf-8;");
            }

            function downloadFile(content, filename, type) {
                const blob = new Blob([content], { type: type });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // Проверка камеры
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                const errDiv = document.getElementById('error-msg');
                errDiv.innerHTML = "<b>Ошибка:</b> Ваш браузер не поддерживает камеру. Используйте Chrome или Safari.";
                errDiv.style.display = 'block';
                document.getElementById('reader').style.display = 'none';
            } else {
                let html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    false
                );
