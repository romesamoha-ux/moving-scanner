["зумбокс","Прочее","стремянка","553-555"],
["зумбокс","Прочее","телеги,","556"],
["зумбокс","Столы","стол","557"],
["зумбокс","Шкафы","шкаф обычный","558"],
["зумбокс","Шредер","шредер большой","559"]
];

/* ФИО: заполнится после ответа Дианы. Формат: {"1-6":"Иванов","21":"Петров"} */
const OWN={};

function each(rng,fn){String(rng).split(",").forEach(function(p){var a,b;if(p.indexOf("-")>-1){var t=p.split("-");a=+t[0];b=+t[1];}else{a=b=+p;}for(var n=a;n<=b;n++)fn(n);});}
const DB={};
SRC.forEach(function(r){each(r[3],function(n){DB["ITM-"+String(n).padStart(3,"0")]={room:r[0],cluster:r[1],item:r[2],owner:"Не указан"};});});
for(var k in OWN){each(k,function(n){var id="ITM-"+String(n).padStart(3,"0");if(DB[id])DB[id].owner=String(OWN[k]).trim()||"Не указан";});}

/* ПАМЯТЬ: тройной резерв */
var K="mp_accept_v7",items=[],ids=new Set(),sc=null,on=false,last="",lastT=0;
function save(){var d=JSON.stringify(items);try{localStorage.setItem(K,d)}catch(e){}try{sessionStorage.setItem(K,d)}catch(e){}try{document.cookie=K+"="+encodeURIComponent(d)+";max-age=31536000;path=/"}catch(e){}}
function load(){var d=null;try{d=localStorage.getItem(K)}catch(e){}
if(!d){try{d=sessionStorage.getItem(K)}catch(e){}}
if(!d){var m=document.cookie.match(new RegExp("(?:^|; )"+K+"=([^;]*)"));if(m){try{d=decodeURIComponent(m[1])}catch(e){}}}
if(!d)return;try{var a=JSON.parse(d);if(Array.isArray(a)){items=a;ids=new Set(a.map(function(x){return x.id}))}}catch(e){}}
function wipe(){try{localStorage.removeItem(K)}catch(e){}try{sessionStorage.removeItem(K)}catch(e){}try{document.cookie=K+"=;max-age=0;path=/"}catch(e){}}

function $(i){return document.getElementById(i)}
function toast(t){var e=$("ts");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function filters(){
 function put(el,arr,lab){var cur=el.value;el.innerHTML='<option value="">'+lab+'</option>'+arr.map(function(v){return '<option>'+esc(v)+'</option>'}).join("");if(arr.indexOf(cur)>-1)el.value=cur;}
 put($("fO"),[...new Set(items.map(function(i){return i.owner}))].sort(),"Все владельцы");
 put($("fC"),[...new Set(items.map(function(i){return i.cluster}))].filter(Boolean).sort(),"Все кластеры");
 put($("fR"),[...new Set(items.map(function(i){return i.room}))].sort(),"Все помещения");}
function vis(){var o=$("fO").value,c=$("fC").value,r=$("fR").value;
 return items.filter(function(i){return (!o||i.owner===o)&&(!c||i.cluster===c)&&(!r||i.room===r)})}
function render(){var v=vis();$("cn").textContent=v.length+" / "+items.length;$("em").style.display=items.length?"none":"block";
 $("ls").innerHTML=v.slice().reverse().map(function(i){return '<li class="I"><div class="f"><div class="t">'+esc(i.item)+'</div><div class="s">'+esc(i.id)+' · '+esc(i.room)+' · '+esc(i.cluster)+' · '+esc(i.time)+'</div></div><div class="o">'+esc(i.owner)+'</div><div class="ck">✓</div><button class="dl" data-id="'+esc(i.id)+'">×</button></li>'}).join("")}
function result(d,dup){$("xI").textContent=d.id+(dup?"  ⚠ УЖЕ В СПИСКЕ":"  ✓ ПРИНЯТО");$("xR").textContent="Помещение: "+d.room;$("xT").textContent=d.item;$("xC").textContent="Кластер: "+d.cluster;$("xO").textContent=d.owner;var b=$("rs");b.style.display="block";b.classList.toggle("dup",!!dup)}

function accept(code){
 var now=Date.now();if(code===last&&now-lastT<1500)return;last=code;lastT=now;
 var k=String(code).split("|")[0].trim().toUpperCase();var m=k.match(/(\d{1,4})/);
 if(!DB[k]&&m)k="ITM-"+String(parseInt(m[1],10)).padStart(3,"0");
 var d=DB[k];if(!d){toast("Код не найден: "+code);return}
 var dup=ids.has(k);result(Object.assign({id:k},d),dup);
 if(navigator.vibrate)navigator.vibrate(dup?[60,60,60]:[110,50,110]);
 if(dup){toast("Уже принято: "+d.item);return}
 ids.add(k);items.push({id:k,room:d.room,cluster:d.cluster,item:d.item,owner:d.owner,time:new Date().toLocaleTimeString("ru-RU")});
 save();filters();render();toast("✓ "+d.item);}

async function start(){
 if(on)return;
 if(!window.isSecureContext){$("er").innerHTML="Камера работает только по HTTPS."; $("er").style.display="block";return}
 $("reader").classList.add("on");$("bS").style.display="none";$("bX").style.display="block";on=true;
 try{sc=new Html5Qrcode("reader",{verbose:false});
  await sc.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},function(t){accept(t);stop()},function(){});
 }catch(e){$("er").innerHTML="Нет доступа к камере: "+esc(e)+"<br>Разрешите камеру в настройках сайта.";$("er").style.display="block";stop()}}
async function stop(){$("bS").style.display="block";$("bX").style.display="none";
 if(sc){try{await sc.stop();await sc.clear()}catch(e){}sc=null}
 $("reader").classList.remove("on");on=false}

function find(){
 var q=$("q").value.trim().toLowerCase();if(!q)return;
 var h=Object.entries(DB).filter(function(e){var id=e[0],d=e[1];return id.toLowerCase().indexOf(q)>-1||d.item.toLowerCase().indexOf(q)>-1||d.room.toLowerCase().indexOf(q)>-1||d.cluster.toLowerCase().indexOf(q)>-1||d.owner.toLowerCase().indexOf(q)>-1});
 if(!h.length){toast("Ничего не найдено");return}
 if(h.length===1){accept(h[0][0]);$("q").value="";return}
 $("cn").textContent=h.length+" найдено";$("em").style.display="none";
 $("ls").innerHTML=h.map(function(e){var id=e[0],d=e[1];return '<li class="I"><div class="f"><div class="t">'+esc(d.item)+'</div><div class="s">'+esc(id)+' · '+esc(d.room)+' · '+esc(d.cluster)+'</div></div><div class="o">'+esc(d.owner)+'</div><button class="b bf ad" data-id="'+esc(id)+'" style="padding:8px 12px;font-size:15px">+</button></li>'}).join("");
 toast("Найдено: "+h.length+". Нажмите + чтобы принять");}

function dl(c,n,t){var b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function exp(){var v=vis();if(!v.length){toast("Список пуст");return}
 var day=new Date().toISOString().slice(0,10);
 var csv="\uFEFFID;Помещение;Кластер;Предмет;Владелец;Время\n";
 v.forEach(function(r){csv+=[r.id,r.room,r.cluster,r.item,r.owner,r.time].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(";")+"\n"});
 dl(csv,"Приемка_"+day+".csv","text/csv;charset=utf-8;");
 var t="ЛИСТ ПРИЕМКИ — MASTER-PEREEZDA.RU\nДата: "+new Date().toLocaleString("ru-RU")+"\nВсего: "+v.length+"\n\n";
 v.forEach(function(r,i){t+=(i+1)+". ["+r.id+"] "+r.room+" / "+r.cluster+" / "+r.item+" (Владелец: "+r.owner+") — "+r.time+"\n"});
 setTimeout(function(){dl(t,"Приемка_"+day+".txt","text/plain;charset=utf-8;")},400)}

$("bS").onclick=start;$("bX").onclick=stop;$("bF").onclick=find;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")find()});
["fO","fC","fR"].forEach(function(i){$(i).onchange=render});
$("bC").onclick=function(){if(confirm("Очистить весь лист приемки?")){items=[];ids.clear();wipe();filters();render();$("rs").style.display="none";toast("Список очищен")}};
$("bE").onclick=exp;
$("ls").addEventListener("click",function(e){var d=e.target.closest(".dl"),a=e.target.closest(".ad");
 if(d){var id=d.dataset.id;items=items.filter(function(x){return x.id!==id});ids.delete(id);save();filters();render();toast("Убрано: "+id)}
 if(a){accept(a.dataset.id)}});
document.addEventListener("visibilitychange",function(){if(document.hidden&&on)stop()});

$("tot").textContent=Object.keys(DB).length;
load();filters();render();
if(items.length)toast("Восстановлено записей: "+items.length);

/* Service Worker: обновляем принудительно */
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(r){r.update()}).catch(function(){});
 navigator.serviceWorker.addEventListener('controllerchange',function(){location.reload()});
}
</script>
